services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: osia-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - /home/ubuntu/osia-qdrant/storage:/qdrant/storage
      - /home/ubuntu/osia-qdrant/snapshots:/qdrant/snapshots
    mem_limit: 6g
    memswap_limit: 7g
    restart: always

  redis:
    image: redis:alpine
    container_name: osia-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: osia-signal
    environment:
      - MODE=json-rpc
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./signal-data:/home/.local/share/signal-cli
    restart: always
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/accounts | grep -q '\\+' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: osia-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  wikijs-db:
    image: postgres:15-alpine
    container_name: osia-wikijs-db
    environment:
      - POSTGRES_DB=wikijs
      - POSTGRES_USER=wikijs
      - POSTGRES_PASSWORD=${WIKIJS_DB_PASSWORD}
    volumes:
      - /home/ubuntu/osia-wikijs/db:/var/lib/postgresql/data
    restart: always

  wikijs:
    image: ghcr.io/requarks/wiki:2
    container_name: osia-wikijs
    init: true
    depends_on:
      - wikijs-db
    environment:
      - DB_TYPE=postgres
      - DB_HOST=wikijs-db
      - DB_PORT=5432
      - DB_USER=wikijs
      - DB_PASS=${WIKIJS_DB_PASSWORD}
      - DB_NAME=wikijs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /home/ubuntu/osia-wikijs/data:/wiki/data
      - /home/ubuntu/osia-wikijs/repo:/wiki/git
    restart: always

  authentik-db:
    image: postgres:15-alpine
    container_name: osia-authentik-db
    environment:
      - POSTGRES_DB=authentik
      - POSTGRES_USER=authentik
      - POSTGRES_PASSWORD=${AUTHENTIK_DB_PASSWORD}
    volumes:
      - /home/ubuntu/osia-authentik/db:/var/lib/postgresql/data
    restart: always

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    container_name: osia-authentik-server
    command: server
    environment:
      - AUTHENTIK_REDIS__HOST=redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /home/ubuntu/osia-authentik/media:/media
      - /home/ubuntu/osia-authentik/certs:/certs
    depends_on:
      - authentik-db
      - redis
    restart: always

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    container_name: osia-authentik-worker
    command: worker
    environment:
      - AUTHENTIK_REDIS__HOST=redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/osia-authentik/media:/media
      - /home/ubuntu/osia-authentik/certs:/certs
    depends_on:
      - authentik-db
      - redis
    restart: always

  kali-sandbox:
    image: kalilinux/kali-rolling
    container_name: osia-kali
    tty: true
    stdin_open: true
    restart: always
    command: >
      sh -c "apt-get update &&
             apt-get install -y nmap whois dnsutils iputils-ping curl &&
             tail -f /dev/null"

  # ---------------------------------------------------------------------------
  # OSIA application services — all built from one shared `osia-app` image and
  # differentiated only by `command:`. This is the one-image-many-workloads
  # shape that carries straight over to Kubernetes Deployments later.
  #
  # NOTE: the phone/ADB stack (persona-daemon, phone-bridge, adb-server) and
  # the host nginx are intentionally NOT here yet — the phone is USB-bound to
  # one node, and nginx becomes an Ingress at the k3s stage.
  #
  # Service-name env overrides below beat the `localhost`-based values in .env,
  # which are correct for host processes but wrong inside the compose network.
  # Using `qdrant` (the service name) instead of qdrant.osia.dev also sidesteps
  # the split-horizon DNS issue where *.osia.dev resolves to 127.0.0.1 inside
  # containers.
  # ---------------------------------------------------------------------------
  osia-app: &osia-app
    build:
      context: .
      dockerfile: Dockerfile
    image: osia-app:latest
    env_file:
      - .env
    environment: &osia-app-env
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OSIA_BASE_DIR: /app
      # Reach the sibling containers by service name (the .env values use
      # localhost:<host-port>, correct only for host processes). Note the
      # INTERNAL ports here (8080, 3000), not the host-mapped ones.
      SIGNAL_API_URL: http://signal-api:8080
      SIGNAL_WS_URL: ws://signal-api:8080
      WIKIJS_URL: http://wikijs:3000/graphql
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
      - qdrant
    restart: always
    # This anchor service is a build/definition template only — it never runs
    # on its own (the `profiles` guard keeps `docker compose up` from starting
    # it). Concrete services below reuse it via `<<: *osia-app`.
    profiles:
      - _template
    command: ["python", "main.py"]

  orchestrator:
    <<: *osia-app
    container_name: osia-orchestrator
    profiles: []
    command: ["python", "main.py"]

  research-worker:
    <<: *osia-app
    container_name: osia-research-worker
    profiles: []
    # Was: systemd timer every 15 min. Now a supervised long-running loop.
    command: ["python", "-m", "src.workers.service_loop", "research_worker:main", "--interval", "900"]

  hermes-worker:
    <<: *osia-app
    container_name: osia-hermes-worker
    profiles: []
    # Was: systemd timer daily at 03:30 UTC. Loop every 24h.
    command: ["python", "-m", "src.workers.service_loop", "hermes_worker:main", "--interval", "86400"]

  profile-worker:
    <<: *osia-app
    container_name: osia-profile-worker
    profiles: []
    # Was: systemd timer every 6h. Note the entrypoint is `_main` in this module.
    command: ["python", "-m", "src.workers.service_loop", "profile_investigation_worker:_main", "--interval", "21600"]

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
